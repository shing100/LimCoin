# 밀어 넣을 때마다 기계가 먼저 본다.
#
# 합의 코드는 "내 노트북에서는 됐다" 가 통하지 않는다. 다른 Node 판에서
# 결과가 다르면 그것이 곧 체인 분기다. 그래서 지원한다고 적은 판 전부에서
# 돌린다.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: 린트
        run: yarn lint

      - name: 테스트
        run: yarn test

      - name: 커버리지
        run: yarn coverage

      - name: 합의 벡터가 코드와 같은지
        run: node scripts/vectors.js --check

  # 퍼저는 씨앗을 바꿔 가며 돌린다. 고정 씨앗만 돌리면 그 한 줄기만 본다.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: ["1", "20260909", "987654321"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: 퍼징 (씨앗 ${{ matrix.seed }})
        run: yarn fuzz
        env:
          LIMCOIN_FUZZ_SEED: ${{ matrix.seed }}

  # 릴리스 산출물이 만들어지고, 두 번 만들면 같은 해시가 나오는지 본다.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 두 번 만들어 해시를 견준다
        run: |
          node scripts/release.js > /dev/null
          FIRST=$(cat dist/SHA256SUMS)
          node scripts/release.js > /dev/null
          SECOND=$(cat dist/SHA256SUMS)
          echo "$FIRST"
          test "$FIRST" = "$SECOND" || { echo "재현되지 않는다"; exit 1; }
          cd dist && sha256sum -c SHA256SUMS
      - name: 풀어서 노드가 뜨는지
        run: |
          mkdir -p /tmp/unpack && tar xzf dist/limcoin-*.tar.gz -C /tmp/unpack
          cd /tmp/unpack/limcoin-*
          test ! -e src/wallet.json && test ! -e src/privateKey
          yarn install --frozen-lockfile --production
          LIMCOIN_NETWORK=regtest HTTP_PORT=3100 LIMCOIN_DATA_DIR=/tmp/rel-chain \
            LIMCOIN_WALLET_FILE=/tmp/rel-wallet.json LIMCOIN_WALLET_TOKEN=none \
            node src/server.js &
          for i in $(seq 1 30); do
            if curl -sf localhost:3100/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf localhost:3100/health
      - uses: actions/upload-artifact@v4
        with:
          name: limcoin-tarball
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # 컨테이너가 실제로 뜨고 블록을 만드는지 본다.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t limcoin:ci .
      - name: regtest 로 띄워 블록 하나
        run: |
          docker run -d --name limcoin-ci -p 3000:3000 \
            -e LIMCOIN_NETWORK=regtest \
            -e LIMCOIN_WALLET_TOKEN=none \
            limcoin:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf localhost:3000/health
          curl -sf -X POST localhost:3000/blocks
          test "$(curl -sf localhost:3000/rpc \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getblockcount"}' \
            | grep -o '"result":[0-9]*')" = '"result":1'
      - name: 로그
        if: always()
        run: docker logs limcoin-ci || true
